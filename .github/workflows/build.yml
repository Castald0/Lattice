name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and core tests
        shell: powershell
        run: ./test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Lattice-Windows
          path: bin/Lattice.exe
